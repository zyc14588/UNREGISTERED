name: AIPT Content Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  aipt-content-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'

      - name: Assert Node.js version
        run: |
          [ "$(node --version)" = "v24.19.0" ] || { echo "expected Node.js v24.19.0, got $(node --version)"; exit 1; }

      - name: Validate AIPT P0-B000 delivery
        run: node scripts/aipt/validate-p0-b000.mjs

      - name: Validate AIPT P0-B001 delivery
        run: node scripts/aipt/validate-p0-b001.mjs

      - name: Validate AIPT P0-B002 delivery
        run: node scripts/aipt/validate-p0-b002.mjs

      - name: Validate AIPT P0-B003 delivery
        run: node scripts/aipt/validate-p0-b003.mjs
